name: Validate Swift app

on:
  push:
    branches: [swift-app]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Swift 6.4 core tests
    runs-on: ubuntu-latest
    container: swift:6.4@sha256:4601bf61dab9485a3e93087770b72d268737e945a5b000e2286b6cc48bb048b6
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/EngineeringCore

  native:
    name: Native iOS and macOS builds
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select the required Apple toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for app in /Applications/Xcode*.app; do
            candidate="$app/Contents/Developer"
            if DEVELOPER_DIR="$candidate" xcrun swift --version | grep -q 'Swift version 6.4'; then
              ios_sdk=$(DEVELOPER_DIR="$candidate" xcrun --sdk iphonesimulator --show-sdk-version)
              mac_sdk=$(DEVELOPER_DIR="$candidate" xcrun --sdk macosx --show-sdk-version)
              if [[ "$ios_sdk" == 27.* && "$mac_sdk" == 27.* ]]; then
                selected="$candidate"
                break
              fi
            fi
          done
          if [[ -z "$selected" ]]; then
            echo '::error::This runner has no Xcode with Swift 6.4 and both iOS 27/macOS 27 SDKs. Native compilation remains unverified.'
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$selected" xcodebuild -version
          DEVELOPER_DIR="$selected" xcrun swift --version
      - name: Resolve local Swift packages
        run: xcodebuild -resolvePackageDependencies -project EngineeringStudio.xcodeproj -scheme EngineeringStudioiOS
      - name: Build iOS
        run: xcodebuild -project EngineeringStudio.xcodeproj -scheme EngineeringStudioiOS -destination 'generic/platform=iOS Simulator' -resultBundlePath Results/iOS.xcresult CODE_SIGNING_ALLOWED=NO build
      - name: Build macOS
        if: (success() || failure()) && steps.toolchain.outcome == 'success'
        run: xcodebuild -project EngineeringStudio.xcodeproj -scheme EngineeringStudioMac -destination 'generic/platform=macOS' -resultBundlePath Results/macOS.xcresult CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-results
          path: Results
          if-no-files-found: ignore
