name: Capture native SwiftUI previews
on:
  push:
    branches: [swift-app]
    paths:
      - 'Tools/SwiftUIPreview/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated SwiftUI preview host
        run: swift Tools/SwiftUIPreview/BuildPreview.swift
      - name: Capture actual SwiftUI view rendering
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults write com.apple.universalaccess increaseContrast -bool false
          open -W -n --stdout "$RUNNER_TEMP/preview.log" --stderr "$RUNNER_TEMP/preview-errors.log" .preview-build/SwiftUIPreview.app --args "$RUNNER_TEMP/native-previews"
          cat "$RUNNER_TEMP/preview.log" "$RUNNER_TEMP/preview-errors.log"
      - uses: actions/upload-artifact@v4
        with:
          name: native-swiftui-previews
          path: ${{ runner.temp }}/native-previews/*.png
          if-no-files-found: error
